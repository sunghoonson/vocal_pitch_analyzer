plugins {
    id "com.android.application"
}

android {
    namespace "local.vocalpitch.s24mic"
    compileSdk 35

    defaultConfig {
        applicationId "local.vocalpitch.s24mic"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0-v44"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
